  /operation-results/{operationId}:
    get:
      tags: [operations]
      operationId: getOperationResult
      summary: 按客户端 operation_id 恢复写操作结果（响应丢失后核实，不重新提交）
      description: |
        客户端把同一个 UUID 既当 Idempotency-Key 又当 operation_id。业务已提交但响应丢失时，
        用本接口取回终态与业务结果，不要换新键重提。

        - 只返回当前 actor 自己的操作；别人的或未知的 operation_id 一律 404（不区分「不存在」与「无权」）。
        - status 为 `in_progress` 表示服务端仍在处理或占位未落终态：客户端继续轮询/等待，不得当作失败重试新键。
        - status 为 `succeeded` 时 `result` 是原响应 data 的快照。**但 succeeded 只代表「请求已被完整处理
          并留下结果」，不代表业务成功**：AI 识别失败时 `POST /ai/tasks` 仍返回 202 且 `data.task.state="failed"`，
          幂等记录记为 succeeded。客户端必须再看 `result.task.state`（AI 任务）或 `result` 内容本身。
        - operation status 是传输层，`task.state` 是业务层，二者不可互相推导。
        - status 为 `failed` 时 `error_code` 必须**等于当时那次失败响应的 `error.code`**（源头上就是同一个值，
          客户端可按它做分支）。若两者不一致属于服务端缺陷：曾有把确认失败错记成 `OPEN_BUSINESS` 的问题。
          重试决策：客户端据此决定是否用**新键**重开一次。
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/OperationResultOK"}
        "404": {$ref: "#/components/responses/NotFound"}
