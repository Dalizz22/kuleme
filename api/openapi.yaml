      summary: 关联照片（上传先落私有文件，关联成功才给库归属；同一文件已挂别处 409）
      description: |
        - 本组照片接口**不要求也不使用 Idempotency-Key**：关联/解除/排序/设主图都是天然幂等或整体替换语义，
          重复提交结果一致。
