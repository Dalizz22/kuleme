    TransferPreviewOK:
      description: 转库预演结果
      content: {application/json: {schema: {type: object, properties: {preview: {$ref: "#/components/schemas/TransferPreview"}}}}}
    MaintenanceOK:
      description: 维修记录
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    MaintenanceList:
