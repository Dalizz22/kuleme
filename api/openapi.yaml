    ImportOK:
      description: 导入批次；data = {batch, preview}（创建时）/ {batch, rows}（详情与确认）；失败行按 ImportRow 逐行返回
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    SpaceSettingsOK:
      description: 库配置与配置版本
      content: {application/json: {schema: {type: object, properties: {settings: {$ref: "#/components/schemas/SpaceSettings"}, config_version: {type: integer}}}}}
