        - primary_file_id 缺省取本次第一张；只允许出现在 file_ids 里。
        - 同一 file_id 已关联到别的物品 → 409 PHOTO_ALREADY_LINKED，不静默改挂。
        - 别人的私有文件、或文件不属于该库 → 403 `FORBIDDEN`「文件不属于该库」（照片链路只用这一种 403 码）。
        - 入参本身不合法（空 file_ids、primary_file_id 不在 file_ids 里、文件 ID 格式错）→ 422 `VALIDATION_FAILED`。
        - 失败不留半关联，已上传但不归属的文件要么删除要么进入可追踪回收。
        - 响应 data: {photos: [PhotoRef]}，按 sort 升序，恰好一条 is_primary=true。
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PhotoLinkInput"}}}
      responses:
        "200": {$ref: "#/components/responses/PhotoListOK"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
