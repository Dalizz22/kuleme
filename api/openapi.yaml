      content: {application/json: {schema: {type: object, properties: {hints: {type: array, items: {$ref: "#/components/schemas/DuplicateHint"}}}}}}
    RecycleSummaryOK:
      description: 回收站汇总
      content: {application/json: {schema: {type: object, properties: {items: {type: integer}, spaces: {type: integer, description: 仅管理员返回非零}}}}}
    RecycleItemList:
      description: 回收站物品分页
      content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/RecycleEntry"}}}}}}
    ExportOK:
      description: 导出记录
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    ExportList:
      description: 下载中心列表
      content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ExportView"}}}}}}
    RuleOK:
      description: 规则
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    RuleList:
      description: 规则列表
      content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Rule"}}}}}}
    RuleRunOK:
      description: 规则运行详情
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    InboxList:
      description: 收件箱消息
      content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/InboxMessage"}}, unread: {type: integer}}}}}
    Unprocessable:
      description: |
        422 语义不合法：缺字段/类型错（VALIDATION_FAILED）、body 里的 uuid 非法、creation_ref 非 uuid、
        Idempotency-Key 非 uuid（INVALID_IDEMPOTENCY_KEY）、位置不存在（INVALID_LOCATION）、
        目标库与当前库相同（INVALID_TRANSFER_TARGET）、status 值非法（INVALID_STATUS）、
        图片张数超限（INVALID_IMAGE_COUNT）、行数超限等。二是**没有 400**。
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    PayloadTooLarge:
      description: |
        413 请求体超限，两种码：`PAYLOAD_TOO_LARGE`（JSON body 超过 1MB，统一由 BindJSON 拦截）与
        `FILE_TOO_LARGE`（文件上传超过 10MB，导入/照片共用限制）。
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    FeatureDisabled:
      description: |
        403 该库关闭了此功能（FEATURE_DISABLED，如关闭出售/维修/盘点）。
        **当前缺口**：服务端只存储库四开关（spaces/:id/settings），出售/维修/盘点链路尚未校验开关，
        因此本码目前不会被返回；客户端按契约实现即可，服务端接线后自动生效。
      content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}
    PhotoListOK:
      description: 照片列表（按 sort 升序，恰一条 is_primary）
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {photos: {type: array, items: {$ref: "#/components/schemas/PhotoRef"}}}}, request_id: {type: string}}}}}
    OperationResultOK:
      description: 写操作结果（按客户端 operation_id 恢复）
      content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/OperationResult"}, request_id: {type: string}}}}}
    CodeResolveOK:
      description: |
        扫码解析结果。`is_code=false` 只有「不是编码」才有（此时没有 resolved）；
        是编码但当前用户不可见时 `is_code=true` 且 `resolved=null`（不用 404，不泄露存在性）。
      content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/CodeResolveResult"}, request_id: {type: string}}}}}
    CandidateConfirmOK:
      description: 确认结果（物品 + 是否幂等命中 + 照片关联逐条回执）
      content: {application/json: {schema: {type: object, properties: {data: {$ref: "#/components/schemas/CandidateConfirmResult"}, request_id: {type: string}}}}}
