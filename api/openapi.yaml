openapi: 3.0.3
info:
  title: 库了么 API
  version: 1.0.0
  description: |
    库了么（klm）HTTP 契约。所有路径带 /api/v1 前缀。
    响应统一外壳：成功 `{data, request_id}`，失败 `{error:{code,message,details?}, request_id}`。
    副作用请求支持 Idempotency-Key 头（库存操作强制）。

    契约基线：
    - 实现状态扩展 `x-klm-status: delivered|planned|removed`。只有 delivered 的路径可直接调用；
      planned 是已定稿、实现未落地的目标契约（web/android 可据此编码，联调前必须确认状态已变 delivered）；
      removed 是已下线、路由不再注册的旧接口。
    - 列表筛选一律服务端执行，`total` 等于过滤后总行数。
    - 写请求可重试入口统一 Idempotency-Key：同键同内容重放原结果，同键异内容 409。
    - 业务校验失败优先 422；遗留接口仍存在 400（见 docs/接口契约约定.md 的差异表）。
    - `GET /items/{id}` 的 allowed_actions 与 action_blocked_reasons 是唯一动作可用性来源，客户端不得自行推导。
servers:
  - url: /api/v1
tags:
  - {name: system}
  - {name: auth}
  - {name: users}
  - {name: spaces}
  - {name: categories}
  - {name: locations}
  - {name: items}
  - {name: photos}
  - {name: operations}
  - {name: files}
  - {name: inventory}
  - {name: stocktakes}
  - {name: loans}
  - {name: sales}
  - {name: jobs}
  - {name: audit}
  - {name: templates}
  - {name: labels}
  - {name: codes}
  - {name: transfer}
  - {name: recycle}
  - {name: rules}
  - {name: ai}
security:
  - bearerAuth: []
paths:
  /system/info:
    get:
      tags: [system]
      security: []
      summary: 实例信息（含是否已初始化）
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SystemInfo"}}}}
  /setup:
    post:
      tags: [auth]
      security: []
      summary: 初始化（创建首个管理员；secret 可空=网页向导模式，仅未初始化时可调）
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SetupInput"}}}
      responses:
        "201": {$ref: "#/components/responses/SessionCreated"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "403": {$ref: "#/components/responses/Forbidden", description: "生产环境（KLM_ENV=prod）且 setup secret 为空 → 403，需先配置 KLM_SETUP_SECRET"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sessions:
    post:
      tags: [auth]
      security: []
      summary: 登录（用户名+密码 → 令牌）
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoginInput"}}}
      responses:
        "201": {$ref: "#/components/responses/SessionCreated"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [auth]
      deprecated: true
      summary: 登出（撤销当前会话；已由 /sessions/current 取代，此路径不再注册）
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /sessions/current:
    delete:
      tags: [auth]
      operationId: logoutCurrentSession
      summary: 登出（撤销当前会话）
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /me:
    get:
      tags: [auth]
      summary: 当前用户
      responses:
        "200": {$ref: "#/components/responses/UserOK"}
  /users:
    get:
      tags: [users]
      summary: 用户列表（管理员）
      parameters: [{$ref: "#/components/parameters/page"}, {$ref: "#/components/parameters/pageSize"}]
      responses:
        "200": {$ref: "#/components/responses/UserList"}
    post:
      tags: [users]
      summary: 创建用户（管理员）
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateUserInput"}}}
      responses:
        "201": {$ref: "#/components/responses/UserOK"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /users/{id}:
    patch:
      tags: [users]
      summary: 更新用户（显示名/管理员/停用，管理员）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UserPatch"}}}
      responses:
        "200": {$ref: "#/components/responses/UserOK"}
        "409": {$ref: "#/components/responses/Conflict"}
  /users/{id}/password:
    put:
      tags: [users]
      summary: 改密码（管理员代改或本人验旧口令；改完撤销全部会话）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PasswordInput"}}}
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /spaces:
    get:
      tags: [spaces]
      summary: 库列表（按可见权限过滤）
      parameters: [{$ref: "#/components/parameters/page"}, {$ref: "#/components/parameters/pageSize"}]
      responses:
        "200": {$ref: "#/components/responses/SpaceList"}
    post:
      tags: [spaces]
      summary: 建库（根库自动成为 owner；子库要求父库 admin）
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SpaceInput"}}}
      responses:
        "201": {$ref: "#/components/responses/SpaceOK"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /spaces/{id}:
    get:
      tags: [spaces]
      operationId: getSpace
      summary: 库详情（【未实现】服务端当前未注册 GET /spaces/:id，客户端从 GET /spaces 列表取）
      x-klm-status: planned
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/SpaceOK"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [spaces]
      summary: 改名/排序/移动（乐观锁 version）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NodePatch"}}}
      responses:
        "200": {$ref: "#/components/responses/SpaceOK"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [spaces]
      summary: 删库（有物品时 409）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "409": {$ref: "#/components/responses/Conflict"}
  /spaces/{id}/members:
    get:
      tags: [spaces]
      summary: 成员列表
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/MemberList"}
  /spaces/{id}/members/{uid}:
    put:
      tags: [spaces]
      summary: 设置成员角色（owner/manager/editor/viewer）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/uid"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [role], properties: {role: {type: string, enum: [owner, manager, editor, viewer]}}}}}
      responses:
        "200": {$ref: "#/components/responses/MemberOK"}
    delete:
      tags: [spaces]
      summary: 移除成员（最后一个 owner 保护 → 409）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/uid"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "409": {$ref: "#/components/responses/Conflict"}
  /spaces/{id}/settings:
    get:
      tags: [spaces]
      operationId: getSpaceSettings
      summary: 库配置（price/sale/maintenance/stocktake 四开关；存储缺项视为开）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/SpaceSettingsOK"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [spaces]
      operationId: putSpaceSettings
      summary: 整体替换四项开关（config_version 乐观锁，冲突 409）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SpaceSettingsInput"}}}
      responses:
        "200": {$ref: "#/components/responses/SpaceSettingsOK"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /spaces/{id}/fields:
    get:
      tags: [spaces]
      operationId: listSpaceFields
      summary: 字段定义列表（按 sort, field_id 排序）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/SpaceFieldList"}
    post:
      tags: [spaces]
      operationId: createSpaceField
      summary: 新增字段定义
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FieldDefInput"}}}
      responses:
        "201": {$ref: "#/components/responses/SpaceFieldOK"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /spaces/{id}/fields/{fieldId}:
    patch:
      tags: [spaces]
      operationId: patchSpaceField
      summary: 改字段定义（version 乐观锁；field_id 稳定不可变；路径里的 fid 非 uuid → 404）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/fieldId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FieldDefPatch"}}}
      responses:
        "200": {$ref: "#/components/responses/SpaceFieldOK"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [spaces]
      operationId: deleteSpaceField
      summary: 删字段定义（路径里的 fid 非 uuid → 404，不是 500）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/fieldId"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
        "404": {$ref: "#/components/responses/NotFound"}
  /categories:
    get:
      tags: [categories]
      summary: 分类树
      responses:
        "200": {$ref: "#/components/responses/NodeList"}
    post:
      tags: [categories]
      summary: 建分类
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NodeInput"}}}
      responses:
        "201": {$ref: "#/components/responses/NodeOK"}
  /categories/{id}:
    get:
      tags: [categories]
      operationId: getCategory
      summary: 分类详情（【未实现】服务端当前未注册 GET /categories/:id，客户端从 GET /categories 列表取）
      x-klm-status: planned
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/NodeOK"}
    patch:
      tags: [categories]
      summary: 改名/排序/移动（乐观锁）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NodePatch"}}}
      responses:
        "200": {$ref: "#/components/responses/NodeOK"}
    delete:
      tags: [categories]
      summary: 删分类（被物品引用时 409）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /locations:
    get:
      tags: [locations]
      operationId: listLocations
      summary: 位置树（全局共享基础数据）
      description: |
        **单户 NAS 部署的设计选择**：位置树是全局共享基础数据，GET /locations 不按 actor 或库过滤，
        登录用户看到的就是全部位置。这不是缺陷，不要当越权 bug 修；多户隔离时才需要按 space 过滤。
        写路径引用位置时同样**只校验「存在且未删除」，不校验位置-库归属**（跨库复用同一位置是合法的）。
        `space_id` 查询参数当前仅作客户端提示用途，不改变返回集合。
      parameters: [{$ref: "#/components/parameters/spaceIdQ"}]
      responses:
        "200": {$ref: "#/components/responses/NodeList"}
    post:
      tags: [locations]
      summary: 建位置（自动分配 10 位码）
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NodeInput"}}}
      responses:
        "201": {$ref: "#/components/responses/NodeOK"}
  /locations/{id}:
    get:
      tags: [locations]
      operationId: getLocation
      summary: 位置详情（【未实现】服务端当前未注册 GET /locations/:id，客户端从 GET /locations 树取）
      x-klm-status: planned
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/NodeOK"}
    patch:
      tags: [locations]
      summary: 改名/排序/移动（乐观锁）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NodePatch"}}}
      responses:
        "200": {$ref: "#/components/responses/NodeOK"}
    delete:
      tags: [locations]
      summary: 删位置（有库存/盘点引用时 409）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /items:
    get:
      tags: [items]
      summary: 物品列表（可见库内过滤；status 服务端筛选）
      parameters:
        - {name: template_key, in: query, schema: {type: string}}
        - {name: keyword, in: query, schema: {type: string}, description: 名称 ILIKE}
        - name: status
          in: query
          description: |
            派生状态筛选，逗号分隔多值（`status=in_stock,sold`，可重复同名参数）。
            缺省或空串 = 全部。非法值 422 INVALID_STATUS，message 中列出合法枚举。
            枚举即服务端派生的全部取值：in_stock/pending_stock/reserved/maintenance/sold/scrapped/lost
            （优先规则，自上而下命中即止：lifecycle 非 normal 时直接取 lifecycle → sold/scrapped/lost；
            有未结维修 maintenance；有预留 reserved；数量为 0 pending_stock；否则 in_stock）。
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [in_stock, pending_stock, reserved, maintenance, sold, scrapped, lost]}
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      description: |
        列表只做筛选分页：**不返回 `allowed_actions` / `action_blocked_reasons`**（这两个字段只有
        `GET /items/{id}` 与 `POST /items` 201 才有值，客户端不要在列表里读它们去做动作可用性判断）。
        已知限制：不支持 `space_id` 过滤参数（传了会被静默忽略；成员本就可见全部可见库）。
      responses:
        "200":
          description: |
            过滤后的分页结果。`total` 必须是同一过滤条件下的总行数（不是当前页行数）。
            data: {items: [Item], page, page_size, total}；items[*].allowed_actions 为 null
          content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
        "422": {$ref: "#/components/responses/Unprocessable"}
    post:
      tags: [items]
      summary: 建物品（模板校验扩展字段；一次请求含可选的期初入库）
      description: |
        建档与期初库存同一事务：要么都成功，要么都不留下。

        - 传 `initial_location_id` 时，`initial_quantity` 缺省为 "1"；成功后 `data.quantity="1"`，
          且 `GET /items/{id}/balances` 有一条 `on_hand=1` 的余额行。
        - 不传 `initial_location_id`（可选，不是必填）时只建档案，`data.quantity="0"`、无余额行，
          状态为待入库（`status="pending_stock"`）。客户端不要在建档成功后再补一次库存操作，
          那会产生两次写入与第二个幂等键。
        - 位置不存在或已删除 → 422 INVALID_LOCATION（位置是全局共享基础数据，本轮只校验「存在且未删除」，不校验位置-库归属）。整单回滚，不留 item/余额/流水。
        - data 为 ItemView（id/public_code/quantity/location_id 等），并带 `allowed_actions` /
          `action_blocked_reasons`（与详情同一套判定）。
        - 幂等重放返回**相同状态码**（201 两次都是 201），靠响应体（同一个 id / `already_exists`）判重放，
          不要靠状态码区分首次与重放。
      parameters: [{$ref: "#/components/parameters/idemKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ItemInput"}}}
      responses:
        "201": {$ref: "#/components/responses/ItemOK"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /items/{id}:
    get:
      tags: [items]
      summary: 物品详情（含位置路径、主图、聚合数量、动作可用性）
      description: |
        `data` 为 ItemView，并带 `allowed_actions`（键固定：
        transfer,sale,scrap,maintenance,stocktake,photos,export）与
        `action_blocked_reasons`（只包含 false 的键 → 中文原因）。
        客户端只按这两个字段显示/禁用动作，不自行推导。
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [items]
      summary: 更新物品（乐观锁 expected_version；字段整体合并）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ItemUpdate"}}}
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [items]
      summary: 删物品（有在手库存时 409）
      parameters: [{$ref: "#/components/parameters/id"}]
      responses:
        "200": {$ref: "#/components/responses/OK"}
  /items/{id}/transfer-preview:
    post:
      tags: [items]
      operationId: transferPreviewItem
      summary: 转库预演（干跑，不落库；返回警告列表）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransferInput"}}}
      responses:
        "200": {$ref: "#/components/responses/TransferPreviewOK"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /items/{id}/transfer:
    post:
      tags: [items]
      operationId: transferItem
      summary: 转库（档案与在手库存整体移至目标库；expected_version 乐观锁；幂等）
      description: |
        - 目标库与当前库相同 → 422 INVALID_TRANSFER_TARGET，message「目标库与当前库相同，库内移位请用库存移动」。
        - 目标位置不存在 → 404 NOT_FOUND「目标位置不存在」。
        - 物品维修中或已终态 → 409 OPEN_BUSINESS。
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idemKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransferInput"}}}
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /items/{id}/sale:
    post:
      tags: [items]
      operationId: sellItem
      summary: 出售（出库+流水+lifecycle=sold+售卖留痕同事务；幂等；库关闭出售时 403）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idemKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ItemSaleInput"}}}
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "403": {$ref: "#/components/responses/FeatureDisabled"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /items/{id}/reverse:
    post:
      tags: [items]
      operationId: reverseItemSale
      summary: 出售纠错（lifecycle 回 normal+原位置入库+流水 correction；幂等）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idemKey"}]
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /items/{id}/for-sale:
    put:
      tags: [items]
      operationId: setItemForSale
      summary: 待售标记（档案层面 for_sale 开关，不动库存）
      parameters: [{$ref: "#/components/parameters/id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [for_sale], properties: {for_sale: {type: boolean}}}}}
      responses:
        "200": {$ref: "#/components/responses/ItemOK"}
        "403": {$ref: "#/components/responses/FeatureDisabled"}
        "404": {$ref: "#/components/responses/NotFound"}
  /items/{id}/maintenance:
    post:
      tags: [items]
      operationId: startItemMaintenance
      summary: 送修（不搬库存；一件至多一条未结维修，重复 409）
      parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/idemKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 200}, note: {type: string, maxLength: 500}}}}}
      responses:
