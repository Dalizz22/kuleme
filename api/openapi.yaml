    StocktakeList:
      description: 盘点分页
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    LoanOK:
      description: 借出单
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    LoanList:
      description: 借出分页
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    SaleOK:
      description: 售卖单
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    SaleList:
      description: 售卖分页
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    JobOK:
      description: 任务
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    JobList:
      description: 任务分页
      content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}
    AuditList:
