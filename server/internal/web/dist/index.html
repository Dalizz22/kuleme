  <body>
    <h1>管理后台尚未构建</h1>
    <p>这个文件是占位页，只为让 <code>go:embed all:dist</code> 能在干净仓库里编译。</p>
    <p>要显示真实界面，先构建前端并把产物放进本目录：</p>
    <pre><code>npm install
npm --workspace @klm/web run build
rm -rf server/internal/web/dist/* &amp;&amp; cp -R apps/web/dist/. server/internal/web/dist/</code></pre>
    <p>然后重新编译服务端：<code>cd server &amp;&amp; go build -o ../bin/klm ./cmd/klm</code>。</p>
  </body>
